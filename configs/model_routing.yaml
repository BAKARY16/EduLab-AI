version: 1
policy: "OpenAI finalise la réponse; les autres composants recherchent, classent ou assurent le repli."

roles:
  final_reasoning:
    provider: openai
    model_env: OPENAI_MODEL
    default_model: gpt-5.6-sol
    endpoint: responses
    reasoning_effort_env: OPENAI_REASONING_EFFORT
    purpose: réponse pédagogique finale, démonstration au tableau, correction

  speech_to_text:
    primary: elevenlabs_scribe
    fallback: openai_gpt_4o_mini_transcribe
    browser_fallback: web_speech_api
    purpose: transcription fidèle des questions et réponses orales

  local_retrieval:
    lexical: tfidf_word_bigrams
    semantic: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    fusion: reciprocal_rank_fusion
    purpose: retrouver les passages officiels du cours par mots et par sens

  web_research:
    primary: serpapi_domain_allowlist
    secondary: gemini_google_search_grounding
    gemini_model_env: GEMINI_MODEL
    purpose: compléter uniquement lorsque le corpus local est insuffisant

  local_fallback:
    model: Qwen/Qwen2.5-0.5B-Instruct
    adapter: EduLab LoRA proof
    purpose: continuité hors OpenAI; qualité non équivalente au moteur principal

  learner_state:
    model: heuristic-0.1.0
    purpose: maîtrise, remédiation et difficulté recommandée
    status: deterministic_explainable_baseline

guardrails:
  - priorité aux documents officiels DPFC validés
  - sources web visibles et marquées non validées pédagogiquement
  - aucune invention de source
  - repli explicite si le contexte est insuffisant
  - aucune décision automatique sanctionnant un élève
